# Configuration file for Flow Shop algorithms

# General settings
general:
  input_file: "data/tai20_5.txt"
  # input_file: "data/tai20_10.txt"
  # input_file: "data/tai20_20.txt"

  # input_file: "data/tai50_5.txt"
  # input_file: "data/tai50_10.txt"
  # input_file: "data/tai50_20.txt"

  # input_file: "data/tai100_5.txt"
  # input_file: "data/tai100_10.txt"
  # input_file: "data/tai100_20.txt"

  # input_file: "data/tai200_10.txt"
  # input_file: "data/tai200_20.txt"

  # input_file: "data/tai500_20.txt"
  instance_number: 0
  # Choose exactly one compare mode:
  # - "ils_compare"
  # - "simulated_annealing_compare"
  algorithm: "ils_compare"
  # algorithm: "simulated_annealing_compare"


visualization:
  save_plots: false
  results_folder: "results"
  multi_convergence_grayscale: false
  # Generowanie wykresów w trybie eksperymentu (per-run convergence.png + batch multi-convergence).
  # Dla testów / przeliczeń trzymaj false. Włącz tylko gdy finalnie chcesz wykresy do artykułu.
  generate_plots: false

algorithm_common:
  time_limit_s: 0.1

quantum:
  # Backend: "simulator" (dimod SimulatedAnnealingSampler) or "dwave" (real D-Wave QPU via Leap)
  # DEFAULT = simulator. QPU campaigns must OPT IN by setting "dwave" explicitly —
  # this prevents accidental quota burn. With "dwave" there is NO silent fallback:
  # a failed QPU call marks the run as FAILED (failed.json) and the batch continues.
  backend: "simulator"
  # D-Wave API token (required only when backend: "dwave").
  # Leave null — the token is read from the DWAVE_API_TOKEN environment
  # variable, loaded from the gitignored .env file (see .env.example).
  dwave_token: null

  # --- quantum_qubo (oryginalne sąsiedztwa, małe n) ---
  num_reads: 100

  # --- quantum_qubo_enhanced (duże n) ---
  num_reads_enhanced: 100       # num_reads dla trybów *_enhanced (zalecane >= 100 na QPU)

  # Windowed decomposition dla quantum_dynasearch_enhanced i quantum_motzkin_enhanced:
  #   window_size: null = auto (obliczane z pojemności D-Wave, ~19 dla Advantage)
  #   overlap_ratio: 0.5 = 50% zakładka między oknami
  window_size: null
  overlap_ratio: 0.5

  # Optional: choose a specific Leap solver
  solver: null
  # Optional sampler parameters forwarded to D-Wave .sample():
  annealing_time_us: null
  chain_strength: null
  num_spin_reversal_transforms: null

  # Limit segmentów dla quantum_dynasearch i quantum_motzkin (oryginalne, nie-enhanced)
  # null = pełne O(n²) — używaj tylko dla małych n (n <= 20)
  L_max_dynasearch: null
  L_max_motzkin: null

iterated_local_search:
  tabu_tenure: 10
  mushroom_k: 10   # rozmiar puli elite w MushroomList

simulated_annealing:
  initial_temp: 1000.0
  final_temp: 100.0        # T_floor=100 utrzymuje losowość Boltzmanna po schłodzeniu
  alpha: 0.99              # wolniejsze chłodzenie — SA dłużej eksploruje
  reheat_factor: 1.5
  stagnation_ms: 100       # częstsze kicki: dla budzetu 1000ms zdąży ~10 kicków
  temp_floor_factor: 1.0

generator:
  enabled: false
  m: 20
  n: 50
  seed: 42

# =============================================================================
# EKSPERYMENT — artykuł "Windowed QUBO / Quantum QUBO Enhanced"
#
# Struktura: 3 klasy × 4 sąsiedztwa = 12 wariantów
#   classical              — CPU, bez limitu n
#   quantum_qubo           — D-Wave oryginalne, n <= 20
#   quantum_qubo_enhanced  — D-Wave enhanced:
#       adjacent_enhanced   n <= 200  (gęste QUBO, bez filtra delta)
#       fibonacci_enhanced  n <= 500  (trójdiagonalne QUBO, bez filtra delta)
#       dynasearch_enhanced n <= 50   (windowed, w=19, ρ=0.5)
#       motzkin_enhanced    n <= 50   (windowed, w=19, ρ=0.5)
#
# Harmonogram:
#
#   ✅ FAZA 1 — baseline classical, n=20  [DONE 2026-05-28, 6h34m, 7200 runów]
#                results/experiments/20260527_205631/
#
#   ⏳ FAZA 2 — skalowanie classical (n=50/100/200/500)
#       2a: tai50_5/10/20      → ~6h
#       2b: tai100_5/10/20     → ~6h
#       2c: tai200_10/20       → ~4h  (brak tai200_5)
#       2d: tai500_20          → ~2h  (tylko 1 plik)
#
#   ⏳ FAZA 3 — quantum (czeka na limit QPU)
#       3a: quantum_qubo (4 oryginalne) na n=20
#       3b: quantum_qubo_enhanced (4) na n=20
#       3c: enhanced scaling (zgodnie z tractability per neighborhood)
#
# Przełączanie fazy: odkomentuj odpowiedni blok instance_files + neighborhoods.
# =============================================================================

experiment:
  enabled: true
  tabu_tenure: 10
  mushroom_k: 10
  repeats: 5          # seeds 0..4 → wystarczy do testu Wilcoxona (n=50 obs.)
  time_limits_s: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  resume_dir: "results/experiments/20260529_065745"  # continue from killed 2d

  # ========== AKTYWNA FAZA: 2a (n=50 classical) ==========
  instance_files:
    - "data/tai500_20.txt"
  neighborhoods:
    - "adjacent"
    - "fibonacci"

  # ========== INNE FAZY (do odkomentowania) ==========


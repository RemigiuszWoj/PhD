# Configuration file for Flow Shop algorithms

# General settings
general:
  input_file: "data/tai20_5.txt"
  # input_file: "data/tai20_10.txt"
  # input_file: "data/tai20_20.txt"

  # input_file: "data/tai50_5.txt"
  # input_file: "data/tai50_10.txt"
  # input_file: "data/tai50_20.txt"

  # input_file: "data/tai100_5.txt"
  # input_file: "data/tai100_10.txt"
  # input_file: "data/tai100_20.txt"

  # input_file: "data/tai200_10.txt"
  # input_file: "data/tai200_20.txt"

  # input_file: "data/tai500_20.txt"
  instance_number: 0
  # Choose exactly one compare mode:
  # - "ils_compare"
  # - "simulated_annealing_compare"
  algorithm: "ils_compare"
  # algorithm: "simulated_annealing_compare"


visualization:
  save_plots: false
  results_folder: "results"
  multi_convergence_grayscale: false

algorithm_common:
  time_limit_s: 0.1

quantum:
  # Backend: "simulator" (dimod SimulatedAnnealingSampler) or "dwave" (real D-Wave QPU via Leap)
  backend: "dwave"
  # D-Wave API token (required only when backend: "dwave")
  dwave_token: "fdMX-33e2e246f5df29cf5bff170adcc763d694ae4046"

  # --- quantum_qubo (oryginalne sąsiedztwa, małe n) ---
  num_reads: 100

  # --- quantum_qubo_enhanced (duże n) ---
  num_reads_enhanced: 100       # num_reads dla trybów *_enhanced (zalecane >= 100 na QPU)

  # Windowed decomposition dla quantum_dynasearch_enhanced i quantum_motzkin_enhanced:
  #   window_size: null = auto (obliczane z pojemności D-Wave, ~19 dla Advantage)
  #   overlap_ratio: 0.5 = 50% zakładka między oknami
  window_size: null
  overlap_ratio: 0.5

  # Optional: choose a specific Leap solver
  solver: null
  # Optional sampler parameters forwarded to D-Wave .sample():
  annealing_time_us: null
  chain_strength: null
  num_spin_reversal_transforms: null

  # Limit segmentów dla quantum_dynasearch i quantum_motzkin (oryginalne, nie-enhanced)
  # null = pełne O(n²) — używaj tylko dla małych n (n <= 20)
  L_max_dynasearch: null
  L_max_motzkin: null

iterated_local_search:
  tabu_tenure: 10
  mushroom_k: 10   # rozmiar puli elite w MushroomList

simulated_annealing:
  initial_temp: 1000.0
  final_temp: 1.0
  alpha: 0.95
  reheat_factor: 1.5
  stagnation_ms: 500
  temp_floor_factor: 1.0

generator:
  enabled: false
  m: 20
  n: 50
  seed: 42

# =============================================================================
# EKSPERYMENT — artykuł "Windowed QUBO / Quantum QUBO Enhanced"
#
# Struktura: 3 klasy × 4 sąsiedztwa = 12 wariantów
#   classical              — CPU, bez limitu n
#   quantum_qubo           — D-Wave oryginalne, n <= 20
#   quantum_qubo_enhanced  — D-Wave enhanced:
#       adjacent_enhanced   n <= 200  (gęste QUBO, bez filtra delta)
#       fibonacci_enhanced  n <= 500  (trójdiagonalne QUBO, bez filtra delta)
#       dynasearch_enhanced n <= 50   (windowed, w=19, ρ=0.5)
#       motzkin_enhanced    n <= 50   (windowed, w=19, ρ=0.5)
#
# Harmonogram instancji (zgodny z tractability Table 1 w artykule):
#
#   FAZA 1 — baseline classical + wszystkie quantum na n=20
#     → tai20_5, tai20_10, tai20_20
#     → wszystkie 12 sąsiedztw
#
#   FAZA 2 — skalowanie enhanced (classical + enhanced, bez quantum_qubo)
#     tai50_5, tai50_10, tai50_20
#       → classical (4) + enhanced wszystkie (4) = 8 sąsiedztw
#     tai100_5, tai100_10, tai100_20
#       → classical (4) + adj_enhanced + fib_enhanced = 6 sąsiedztw
#     tai200_10, tai200_20
#       → classical (4) + adj_enhanced + fib_enhanced = 6 sąsiedztw
#     tai500_20
#       → classical (4) + fib_enhanced = 5 sąsiedztw
#
# Poniższy config odpowiada FAZIE 1.
# Skomentuj/odkomentuj odpowiednie linie żeby przełączyć fazę.
# =============================================================================

experiment:
  enabled: true
  tabu_tenure: 10
  mushroom_k: 10
  repeats: 5          # seeds 0..4 → wystarczy do testu Wilcoxona (n=50 obs.)
  time_limits_s: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  resume_dir: results/experiments/20260508_200411

  # --- FAZA 1: n=20, wszystkie 12 sąsiedztw ---
  instance_files:
    - "data/tai20_5.txt"
    - "data/tai20_10.txt"
    - "data/tai20_20.txt"

  # --- FAZA 2a: n=50, classical + wszystkie enhanced ---
  # instance_files:
  #   - "data/tai50_5.txt"
  #   - "data/tai50_10.txt"
  #   - "data/tai50_20.txt"

  # --- FAZA 2b: n=100, classical + adj_enhanced + fib_enhanced ---
  # instance_files:
  #   - "data/tai100_5.txt"
  #   - "data/tai100_10.txt"
  #   - "data/tai100_20.txt"

  # --- FAZA 2c: n=200 ---
  # instance_files:
  #   - "data/tai200_10.txt"
  #   - "data/tai200_20.txt"

  # --- FAZA 2d: n=500, tylko fib_enhanced mieści się na QPU ---
  # instance_files:
  #   - "data/tai500_20.txt"

  # -------------------------------------------------------------------------
  # FAZA 1 — wszystkie 12 sąsiedztw (n=20 mieści się w każdej klasie)
  neighborhoods:
    # classical
    - "adjacent"
    - "fibonacci"
    - "dynasearch"
    - "motzkin"
    # quantum_qubo (oryginalne, n <= 20)
    - "quantum_adjacent"
    - "quantum_fibonacci"
    - "quantum_dynasearch"
    - "quantum_motzkin"
    # quantum_qubo_enhanced
    - "quantum_adjacent_enhanced"
    - "quantum_fibonacci_enhanced"
    - "quantum_dynasearch_enhanced"
    - "quantum_motzkin_enhanced"

  # -------------------------------------------------------------------------
  # FAZA 2a — n=50 (quantum_qubo oryginalne wykluczone, dyn/motz_enhanced OK)
  # neighborhoods:
  #   - "adjacent"
  #   - "fibonacci"
  #   - "dynasearch"
  #   - "motzkin"
  #   - "quantum_adjacent_enhanced"
  #   - "quantum_fibonacci_enhanced"
  #   - "quantum_dynasearch_enhanced"
  #   - "quantum_motzkin_enhanced"

  # -------------------------------------------------------------------------
  # FAZA 2b — n=100 (dyn/motz_enhanced poza limitem n<=50)
